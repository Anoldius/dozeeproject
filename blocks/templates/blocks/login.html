{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingia | Dozee Imara Blocks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blocks/css/style.css' %}">
</head>
<body class="bg-light">

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card border-0 shadow-lg p-4 rounded-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Ingia Dozee</h2>
                    <p class="text-muted small">Weka taarifa zako kuendelea na huduma.</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jina la Mtumiaji (Username)</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Neno la Siri (Password)</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold rounded-pill mt-3">INGIA</button>
                </form>
                <div class="text-center mt-4">
                    <p class="small">Huna akaunti? <a href="{% url 'membership' %}" class="text-warning fw-bold">Jisajili Hapa</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
